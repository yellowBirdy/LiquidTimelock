[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 500
fail_on_revert = true

[profile.ci.fuzz]
runs = 1_000

[profile.ci.invariant]
runs = 512
depth = 1_000
fail_on_revert = true
